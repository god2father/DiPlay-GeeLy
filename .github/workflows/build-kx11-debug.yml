name: Build KX11_A2 Debug APK

on:
  push:
    branches: [kx11-a2-adapt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and assemble KX11_A2 debug APKs
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:assembleDebug :vehicle-bridge:assembleDebug --stacktrace
      - name: Upload KX11_A2 debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-KX11-A2-debug-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            vehicle-bridge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
